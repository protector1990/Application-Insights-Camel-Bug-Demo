plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.marko'
version = '0.0.1-SNAPSHOT'
description = 'AI Camel Bug'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter:4.22.1'
    implementation 'org.apache.camel.springboot:camel-jms-starter:4.22.1'
    implementation 'org.apache.camel.springboot:camel-jackson-starter:4.22.1'
    implementation 'org.apache.camel.springboot:camel-activemq-starter:4.22.1'
    implementation 'org.apache.camel.springboot:camel-opentelemetry-starter:4.22.1'
    implementation("org.springframework.boot:spring-boot-starter-activemq")
    implementation("io.opentelemetry:opentelemetry-api:1.55.0")
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    if (project.hasProperty('appJvmArgs')) {
        jvmArgs = project.property('appJvmArgs').toString().split('\\s+') as List
    }
}